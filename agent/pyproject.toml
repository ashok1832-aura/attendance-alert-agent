[project]
name = "attendance-alert-agent"
version = "0.1.0"
description = "MAF agent that emails students below the college attendance threshold, hosted on Azure AI Foundry"
requires-python = ">=3.11,<3.12"
dependencies = [
    "agent-framework-core==1.19.0",
    "mcp==1.30.0",
    "agent-framework-foundry==1.13.1",
    "agent-framework-foundry-hosting==1.0.0b260918",
    "azure-ai-projects==2.3.0",
    "azure-identity==1.25.3",
    "azure-search-documents==12.0.0",
    "mssql-python>=1.0.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.5",
    "ruff==0.4.0",
]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
